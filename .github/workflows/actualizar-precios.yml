# Guardar este archivo en: .github/workflows/actualizar-precios.yml
name: Actualizar precios de supermercados

on:
  schedule:
    - cron: "0 9 */2 * *"  # cada 48hs aprox., 9:00 UTC (6:00 hora Argentina)
  workflow_dispatch: {}     # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python buscar_precios.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git diff --cached --quiet || git commit -m "Actualizar precios $(date -u +%Y-%m-%d)"
          git push
